<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 40">
  <!-- Component: smartphone | Tier: prop | Origin: top-left corner at (0,0) -->
  <g data-component="prop-phone" data-tier="prop" data-attach-grip="11,20">
    <!-- Phone body — rounded rectangle as path -->
    <path d="M4,1 C2.5,1 1,2.5 1,4 L1,36 C1,37.5 2.5,39 4,39 L18,39 C19.5,39 21,37.5 21,36 L21,4 C21,2.5 19.5,1 18,1 Z"
      stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Screen area -->
    <path d="M4,5 C3.5,5 3,5.5 3,6 L3,32 C3,32.5 3.5,33 4,33 L18,33 C18.5,33 19,32.5 19,32 L19,6 C19,5.5 18.5,5 18,5 Z"
      stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Screen glow line — content hint -->
    <path d="M6,14 C8,13 14,13 16,14" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M6,18 C9,17 12,17 14,18" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
    <!-- Speaker notch at top -->
    <path d="M8,3 L14,3" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Home button hint at bottom -->
    <path d="M11,34 C12.1,34 13,34.9 13,36 C13,37.1 12.1,38 11,38 C9.9,38 9,37.1 9,36 C9,34.9 9.9,34 11,34"
      stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
</svg>
