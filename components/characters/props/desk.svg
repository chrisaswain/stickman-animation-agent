<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 55">
  <!-- Component: work desk (front view, surface and two legs) | Tier: prop | Origin: top-left at (0,0) -->
  <g data-component="prop-desk" data-tier="prop" data-attach-surface="45,10" data-attach-center="45,28">
    <!-- Desktop surface — slightly irregular top -->
    <path d="M3,8 L87,8 L88,14 L2,14 Z" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Surface edge detail -->
    <path d="M4,11 L86,11" stroke="#1A1A1A" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>
    <!-- Left leg -->
    <path d="M10,14 C9,26 8,38 8,52" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right leg -->
    <path d="M80,14 C81,26 82,38 82,52" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Cross support bar -->
    <path d="M12,36 C30,38 60,38 78,36" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
