<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -6 24 14">
  <!-- Component: running shoe (dynamic, sole partially visible, pointing right) | Tier: 1 | Origin: ankle at (0,0) -->
  <g data-component="foot-running-shoe" data-tier="1" data-attach-ankle="0,0">
    <!-- Shoe upper — angled forward dynamically -->
    <path d="M0,0 C4,1 10,3 16,1 C19,-1 18,-4 14,-4 C8,-3 3,-2 0,0"
      stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Sole — visible underneath, showing push-off -->
    <path d="M2,2 C6,4 12,5 16,3" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Sole tread marks -->
    <path d="M5,3 L6,4" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M9,4 L10,5" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M13,3 L14,4" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
