    <!-- Eyes — slightly squinted from smiling -->
    <path d="M-18,-1 C-16,2 -12,2 -10,-1" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M10,-1 C12,2 16,2 18,-1" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
