    <!-- Eyes — narrowed -->
    <circle cx="-15" cy="0" r="3" fill="#1A1A1A"/>
    <circle cx="13" cy="0" r="3" fill="#1A1A1A"/>
    <!-- Eyebrows — V-shaped, angled down toward center -->
    <path d="M-23,-5 C-18,-6 -10,-8 -5,-12" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M5,-12 C10,-8 18,-6 23,-5" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Mouth — tight, flat -->
    <path d="M-10,20 C-5,19 5,19 10,20" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
