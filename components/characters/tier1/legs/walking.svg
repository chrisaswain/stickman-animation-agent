<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 55 82">
  <!-- Component: walking legs (side-view stride facing right) | Tier: 1 | Origin: hip center at (0,0) -->
  <g data-component="legs-walking" data-tier="1" data-attach-hip="0,0" data-attach-front-ankle="35,78" data-attach-back-ankle="-10,78">
    <!-- Front leg (leading) - filled with thickness -->
    <path d="M3,0 C10,16 20,38 33,74 L37,78 L37,74 C24,38 14,16 7,0 Z"
      stroke="#1A1A1A" stroke-width="2.5" fill="#3A3A5A" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Back leg (trailing) - filled with thickness -->
    <path d="M-4,0 C-7,18 -10,48 -12,74 L-8,78 L-8,74 C-6,48 -3,18 0,0 Z"
      stroke="#1A1A1A" stroke-width="2.5" fill="#3A3A5A" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Waistband -->
    <path d="M-6,0 L9,0" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
