<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 40 68">
  <!-- Component: hoodie torso (side view, facing right) | Tier: 1 | Origin: neck top center at (0,0) -->
  <!-- USE WITH: profile head + walking legs -->
  <g data-component="torso-hoodie-side" data-tier="1" data-attach-neck="0,0" data-attach-front-shoulder="14,8" data-attach-back-shoulder="-14,8" data-attach-hip="0,65">
    <!-- Bean body — narrower side profile, slightly looser than t-shirt -->
    <path d="M-17,5 C-19,7 -20,11 -19,16 C-17,30 -14,42 -10,52 C-8,58 -4,63 0,65 C4,63 8,58 10,52 C14,42 17,30 19,16 C20,11 19,7 17,5 C12,2 5,0 0,0 C-5,0 -12,2 -17,5 Z"
      stroke="#1A1A1A" stroke-width="3" fill="url(#crosshatch-dense)" stroke-linecap="round"/>
    <!-- Hood collar (side view) -->
    <path d="M-10,2 C-5,7 5,7 10,2" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Hood back (visible from side — bunched behind neck) -->
    <path d="M-10,2 C-14,-2 -16,-5 -14,-3" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Drawstring (one visible from side) -->
    <path d="M3,7 C4,13 4,20 3,25" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Front pocket (side view — just the opening) -->
    <path d="M-8,36 C0,37 10,37 14,36" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Side seam -->
    <path d="M-16,20 C-14,35 -12,48 -8,58" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
