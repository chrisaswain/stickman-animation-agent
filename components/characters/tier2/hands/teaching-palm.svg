<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -16 22 20">
  <!-- Component: open palm teaching gesture (5 fingers) | Tier: 2 | Origin: wrist at (0,0) -->
  <g data-component="hand-teaching-palm" data-tier="2" data-attach-wrist="0,0">
    <!-- Palm base -->
    <path d="M0,0 C-2,-6 0,-12 3,-14"
      stroke="#1A1A1A" stroke-width="2" fill="#E5DDD0" stroke-linecap="round"/>
    <!-- Thumb -->
    <path d="M3,-14 C5,-16 8,-14 8,-10 L8,-4"
      stroke="#1A1A1A" stroke-width="2" fill="#E5DDD0" stroke-linecap="round"/>
    <!-- Index -->
    <path d="M8,-4 L8,-12 C8,-16 11,-18 13,-15 L13,-8"
      stroke="#1A1A1A" stroke-width="2" fill="#E5DDD0" stroke-linecap="round"/>
    <!-- Middle -->
    <path d="M13,-8 L13,-14 C13,-18 16,-18 18,-14 L18,-8"
      stroke="#1A1A1A" stroke-width="2" fill="#E5DDD0" stroke-linecap="round"/>
    <!-- Ring -->
    <path d="M13,-6 C13,-10 16,-12 18,-8"
      stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Pinky -->
    <path d="M18,-8 C20,-12 22,-10 20,-6"
      stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Palm fill -->
    <path d="M4,-2 C8,-4 14,-4 18,-2 C16,2 8,4 2,2 Z"
      stroke="#1A1A1A" stroke-width="2" fill="#E5DDD0" stroke-linecap="round"/>
  </g>
</svg>
