    <path d="M-13,38 C-15,83 -16,138 -13,198" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M14,36 C16,83 17,138 14,198" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <!-- Belt/sash -->
