      stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Belt knot detail -->
    <path d="M-2,63 C-4,70 -6,78 -3,83" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M2,63 C4,70 6,78 3,83" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Tunic hem detail -->
