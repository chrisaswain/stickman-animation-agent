  <g data-component="torso-lab-coat" data-tier="2" data-attach-neck="0,0" data-attach-left-shoulder="-36,11" data-attach-right-shoulder="37,11" data-attach-left-hip="-10,96" data-attach-right-hip="20,96" data-attach-hem="0,185">
    <!-- Inner shirt -->
    <path d="M-20,11 C-23,14 -24,21 -22,31 L-20,96 C-13,101 14,101 20,96 L22,31 C24,21 23,14 20,11 Z"
      stroke="#1A1A1A" stroke-width="2" fill="url(#crosshatch)" stroke-linecap="round"/>
    <!-- Lab coat left side -->
    <path d="M-36,11 C-40,51 -43,96 -46,186 L-30,188 C-28,136 -26,91 -23,46"
      stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
