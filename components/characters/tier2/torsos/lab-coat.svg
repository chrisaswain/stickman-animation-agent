    <path d="M-23,11 C-21,26 -19,46 -18,61" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Right lapel -->
    <path d="M24,11 C22,26 20,46 19,61" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Coat fold lines -->
    <path d="M-38,56 C-40,96 -42,141 -43,176" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <path d="M38,56 C40,96 41,141 42,176" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- Pocket with pen -->
