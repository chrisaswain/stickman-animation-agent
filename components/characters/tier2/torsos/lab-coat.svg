      stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M30,36 C30,44 30,46 30,51" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
