<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 30 215">
  <!-- Component: cape draping from shoulder | Tier: 2 | Origin: shoulder attachment at (0,0) -->
  <g data-component="cape" data-tier="2" data-attach-shoulder="0,0">
    <!-- Outer edge -->
    <path d="M0,0 C12,6 19,28 22,63 C26,108 24,158 19,208"
      stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Inner drape -->
