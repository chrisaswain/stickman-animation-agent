      stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Fold lines -->
    <path d="M9,28 C12,68 14,118 12,178" stroke="#1A1A1A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M16,48 C18,88 19,138 17,198" stroke="#1A1A1A" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round"/>
  </g>
</svg>
